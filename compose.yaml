services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ENVIRONMENT: production
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS to the exact deployed frontend origin}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY to a random secret of at least 32 characters}
      DATA_DIR: /data
      DB_PATH: /data/tax_shield.db
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-1048576}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
    ports:
      - "8000:8000"
    volumes:
      - tax-shield-data:/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?Set VITE_API_BASE_URL to the browser-reachable backend URL}
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  tax-shield-data:
